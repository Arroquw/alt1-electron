name: Build/release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt install pkg-config libxcb-icccm4-dev libxcb-shm0-dev libxcb-composite0-dev libxcb-ewmh-dev libxcb-record0-dev libxcb-shape0-dev
        if: matrix.os == 'ubuntu-latest'

      - name: Install Node.js, NPM
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set nightly version
        shell: bash
        run: |
          DATE=$(date +%Y%m%d%H%M)
          npm version "0.${DATE}.0-nightly" --no-git-tag-version

      - name: Build (no publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run build -- --mode production
          npm run dist -- --publish never

      - name: Upload Linux to Artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            release/*.AppImage
            release/latest-*.yml
          retention-days: 1

      - name: Upload MacOS to Artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            release/*.dmg
            release/latest-*.yml
          retention-days: 1

      - name: Upload Windows to Artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            release/*.exe
            release/*.yaml
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: final-release-files
          merge-multiple: true

      - name: Publish Nightly release & Clear old assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create nightly --title "Nightly" --latest --notes "Automated build" || true

          assets=$(gh release view nightly --json assets --jq '.assets[].name')
          for asset in $assets; do
            gh release delete-asset nightly "$asset" -y
          done

          gh release upload nightly final-release-files/* --clobber

      - name: Move nightly tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api -X PATCH repos/${{ github.repository }}/git/refs/tags/nightly -f sha="${GITHUB_SHA}"
