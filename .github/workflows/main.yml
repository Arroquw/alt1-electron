name: Build/release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt install pkg-config libxcb-icccm4-dev libxcb-shm0-dev libxcb-composite0-dev libxcb-ewmh-dev libxcb-record0-dev libxcb-shape0-dev
        if: matrix.os == 'ubuntu-latest'

      - name: Install Node.js, NPM
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set nightly version
        shell: bash
        run: |
          DATE=$(date +%Y%m%d%H%M)
          # e.g. 0.202603071230.0-nightly
          npm version "0.${DATE}.0-nightly" --no-git-tag-version

      - name: Build (no publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run build -- --mode production
          npm run dist -- --publish never

      - name: Move nightly tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH repos/${{ github.repository }}/git/refs/tags/nightly -f sha="${GITHUB_SHA}"

      - name: Publish rolling Nightly release
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create nightly --title "Nightly" --latest --notes "Automated build" || true

      - name: Clear old artifacts
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=$(gh release view nightly --json assets --jq '.assets[].name')
          for asset in $assets; do
            gh release delete-asset nightly "$asset" -y
          done

      - name: Upload Linux artifacts
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload nightly release/*.AppImage release/latest-*.yml --clobber

      - name: Upload MacOS artifacts
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload nightly release/*.dmg release/latest-*.yml --clobber

      - name: Upload Windows artifacts
        shell: bash
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload nightly release/*.exe release/latest-* --clobber
